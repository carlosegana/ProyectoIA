<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="790" viewBox="0 0 1500 790" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.fn{font-size:15px;font-weight:700;fill:#14233f;font-family:"SF Mono",Menlo,Consolas,monospace}
.sub{font-size:12.5px;fill:#4a5568}
.err{font-size:11px;fill:#c0392b;font-weight:600}
.lab{font-size:12px}
.title{font-size:24px;font-weight:700;fill:#14233f}
.st{font-size:13.5px;fill:#6b7280}
.ph{font-size:14px;font-weight:700}
.pl{font-size:12.5px;fill:#374151}
</style></defs>
<rect width="1500" height="790" fill="#ffffff"/>
<text x="30" y="46" class="title">Arquitectura de la miniaplicación</text>
<text x="30" y="70" class="st">Cómo viaja una petición hasta Gemini y cómo vuelve</text>
<rect x="30" y="204" width="170" height="64" rx="32.0" fill="#eaf7ee" stroke="#2f8f4e" stroke-width="1.6"/><text x="115.0" y="231.0" class="fn" text-anchor="middle">Usuario / script</text><text x="115.0" y="249.0" class="sub" text-anchor="middle">pregunta + instrucción</text>
<rect x="250" y="180" width="200" height="112" rx="10" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.6"/><text x="350.0" y="208" class="fn" text-anchor="middle">armar_peticion()</text><text x="350.0" y="230" class="sub" text-anchor="middle">arma url + body JSON</text><text x="350.0" y="248" class="sub" text-anchor="middle">schema opcional</text><text x="350.0" y="280" class="err" text-anchor="middle">⚠ ValueError</text>
<rect x="520" y="180" width="200" height="112" rx="10" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.6"/><text x="620.0" y="208" class="fn" text-anchor="middle">con_reintento()</text><text x="620.0" y="230" class="sub" text-anchor="middle">hasta 3 intentos</text><text x="620.0" y="248" class="sub" text-anchor="middle">espera 2s, 4s…</text>
<rect x="790" y="180" width="200" height="112" rx="10" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.6"/><text x="890.0" y="208" class="fn" text-anchor="middle">enviar_peticion()</text><text x="890.0" y="230" class="sub" text-anchor="middle">POST y valida status</text><text x="890.0" y="248" class="sub" text-anchor="middle">mide la latencia</text><text x="890.0" y="280" class="err" text-anchor="middle">⚠ Value · Runtime · TimeoutError</text>
<rect x="1200" y="174" width="260" height="124" rx="10" fill="#fff4e0" stroke="#d98a00" stroke-width="1.6"/><text x="1330.0" y="202" class="fn" text-anchor="middle">API de Gemini</text><text x="1330.0" y="224" class="sub" text-anchor="middle">generateContent</text><text x="1330.0" y="242" class="sub" text-anchor="middle">(HTTPS)</text>
<rect x="790" y="40" width="200" height="72" rx="10" fill="#fff4e0" stroke="#d98a00" stroke-width="1.6"/>
<text x="890" y="68" class="fn" text-anchor="middle">.env</text><text x="890" y="90" class="sub" text-anchor="middle">GEMINI_API_KEY</text>
<path d="M200,236.0 L248,236.0" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M450,236.0 L518,236.0" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<text x="484" y="228.0" class="lab" text-anchor="middle" fill="#555">url, body</text>
<path d="M720,236.0 L788,236.0" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M990,220.0 L1198,220.0" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<text x="1094" y="212.0" class="lab" text-anchor="middle" fill="#555">POST (url, body)</text>
<path d="M1198,252.0 L992,252.0" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<text x="1094" y="270.0" class="lab" text-anchor="middle" fill="#555">JSON + usageMetadata</text>
<path d="M890,112 L890,178" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<text x="900" y="150" class="lab" text-anchor="start" fill="#555">header x-goog-api-key</text>
<path d="M830,180 C830,132 650,132 650,178" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<text x="740" y="128" class="lab" text-anchor="middle" fill="#c0392b">TimeoutError: reintenta</text>
<rect x="790" y="390" width="200" height="112" rx="10" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.6"/><text x="890.0" y="418" class="fn" text-anchor="middle">extraer_texto()</text><text x="890.0" y="440" class="sub" text-anchor="middle">candidates[0]…text</text><text x="890.0" y="490" class="err" text-anchor="middle">⚠ RuntimeError</text>
<rect x="1050" y="390" width="244" height="112" rx="10" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.6"/><text x="1172.0" y="418" class="fn" text-anchor="middle">parsear_respuesta_json()</text><text x="1172.0" y="440" class="sub" text-anchor="middle">limpia y valida claves</text><text x="1172.0" y="490" class="err" text-anchor="middle">⚠ ValueError</text>
<rect x="1340" y="414" width="120" height="64" rx="32.0" fill="#eaf7ee" stroke="#2f8f4e" stroke-width="1.6"/><text x="1400.0" y="441.0" class="fn" text-anchor="middle">Dato</text><text x="1400.0" y="459.0" class="sub" text-anchor="middle">estructurado</text>
<rect x="520" y="390" width="200" height="112" rx="10" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.6"/><text x="620.0" y="418" class="fn" text-anchor="middle">calcular_costo()</text><text x="620.0" y="440" class="sub" text-anchor="middle">tokens × precio</text><text x="620.0" y="458" class="sub" text-anchor="middle">entrada y salida</text>
<rect x="230" y="414" width="170" height="64" rx="32.0" fill="#eaf7ee" stroke="#2f8f4e" stroke-width="1.6"/><text x="315.0" y="450.0" class="fn" text-anchor="middle">Costo en USD</text>
<path d="M890,292 L890,388" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<text x="900" y="345" class="lab" text-anchor="start" fill="#555">datos</text>
<path d="M990,446.0 L1048,446.0" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<text x="1019" y="438.0" class="lab" text-anchor="middle" fill="#555">texto</text>
<path d="M1294,446.0 L1338,446.0" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M815,292 L815,336 L620,336 L620,388" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<text x="718" y="328" class="lab" text-anchor="middle" fill="#555">tokens usados</text>
<path d="M520,446.0 L402,446.0" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="230" y="560" width="1230" height="200" rx="12" fill="#fdf6f5" stroke="#e3b4ae" stroke-width="1.4"/>
<text x="254" y="592" class="ph" fill="#4a1511">Errores que manejo y cuáles se reintentan</text>
<text x="254" y="628" class="fn" fill="#c0392b" style="fill:#c0392b">ValueError</text>
<text x="254" y="648" class="sub" style="font-style:italic">no se reintenta</text>
<text x="254" y="678" class="pl">· pregunta vacía o falta la API key</text>
<text x="254" y="702" class="pl">· key inválida (400, 401, 403)</text>
<text x="254" y="726" class="pl">· JSON inválido o faltan claves</text>
<text x="659" y="628" class="fn" fill="#c0392b" style="fill:#c0392b">RuntimeError</text>
<text x="659" y="648" class="sub" style="font-style:italic">no se reintenta</text>
<text x="659" y="678" class="pl">· otro status, ej. 404</text>
<text x="659" y="702" class="pl">· la respuesta no es JSON</text>
<text x="659" y="726" class="pl">· no viene texto (bloqueada o vacía)</text>
<text x="1064" y="628" class="fn" fill="#c0392b" style="fill:#c0392b">TimeoutError</text>
<text x="1064" y="648" class="sub" style="font-style:italic">sí se reintenta</text>
<text x="1064" y="678" class="pl">· 429 o error 5xx</text>
<text x="1064" y="702" class="pl">· sin conexión o timeout</text>
<text x="1064" y="726" class="pl">· hasta 3 intentos, espera 2s, 4s</text>
</svg>